[project]
name = "phishing-url-detector"
version = "0.1.0"
description = "Detecting phishing URLs from the URL alone, with a scoring API and a Chrome extension"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tldextract>=5.1",
    "lightgbm>=4.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyterlab>=4.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
