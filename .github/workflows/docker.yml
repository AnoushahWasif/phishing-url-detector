name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t phishing-api .

      - name: Start and score
        run: |
          docker run -d --name api -p 8000:8000 phishing-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          curl -fs -X POST localhost:8000/score -H 'content-type: application/json' \
            -d '{"url": "http://192.168.4.20/bank"}' | tee score.json
          grep -q '"label":"phishing"' score.json
          test "$(docker exec api id -u)" = "10001"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/score \
            -H 'content-type: application/json' -d '{"url": "javascript:alert(1)"}')" = "422"

      - name: Container logs
        if: failure()
        run: docker logs api || true
